networks:
  bench-net:
    name: spark_machine_learning_bench-net

volumes:
  hdfs-nn:
  hdfs-dn:
  spark-history:
  mlruns:
  mlartifacts:
  nm1-local:
  nm1-logs:
  nm2-local:
  nm2-logs:

services:
  namenode:
    image: sertitanius/spark_machine_learning-hadoop:3.3.6
    container_name: namenode
    hostname: namenode
    user: "0:0"
    networks: [bench-net]
    ports:
      - "9870:9870"   # NN UI
      - "8020:8020"   # NN RPC (fs.defaultFS)
    volumes:
      - hdfs-nn:/var/lib/hadoop-hdfs
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - PATH=/opt/hadoop/bin:/opt/hadoop/sbin:$PATH
      - ENSURE_NAMENODE_DIR=/var/lib/hadoop-hdfs/name
    entrypoint: ["/bin/sh", "-c"]
    command: ["if [ ! -d /var/lib/hadoop-hdfs/name/current ]; then hdfs namenode -format -force -nonInteractive; fi && hdfs namenode"]
    healthcheck:
      test: ["CMD", "/opt/hadoop/bin/hdfs", "dfsadmin", "-report"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  datanode:
    image: sertitanius/spark_machine_learning-hadoop:3.3.6
    container_name: datanode
    hostname: datanode
    user: "0:0"
    depends_on:
      namenode:
        condition: service_healthy
    networks: [bench-net]
    ports:
      - "9864:9864"   # DN UI
    volumes:
      - hdfs-dn:/var/lib/hadoop-hdfs
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - PATH=/opt/hadoop/bin:/opt/hadoop/sbin:$PATH
    entrypoint: ["/bin/sh", "-c"]
    command: ["hdfs datanode"]
    healthcheck:
      test: ["CMD", "/opt/hadoop/bin/hdfs", "dfs", "-ls", "/"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  resourcemanager:
    image: sertitanius/spark_machine_learning-hadoop:3.3.6
    container_name: resourcemanager
    hostname: resourcemanager
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    networks: [bench-net]
    ports:
      - "8088:8088"
      - "8030:8030"
      - "8031:8031"
      - "8032:8032"
      - "8033:8033"
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - PATH=/opt/hadoop/bin:/opt/hadoop/sbin:$PATH
    entrypoint: ["/bin/sh", "-c"]
    command: ["yarn resourcemanager"]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "resourcemanager"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  nodemanager-1:
    image: sertitanius/spark_machine_learning-hadoop:3.3.6
    container_name: nodemanager-1
    hostname: nodemanager-1
    user: "0:0"
    # init: true добавляет tini как PID 1 внутри контейнера.
    # Без него Java-процесс NodeManager становится PID 1 и не вызывает wait()
    # для завершившихся дочерних MapReduce-контейнеров → тысячи зомби накапливаются
    # → NM мониторит все 20k+ PID через /proc каждые 3s → CPU-шторм даже в idle.
    # Исправляет повышенный CV у короткоживущих задач (small profile, большие топологии).
    init: true
    networks: [bench-net]
    depends_on:
      resourcemanager: { condition: service_healthy }
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - PATH=/opt/hadoop/bin:/opt/hadoop/sbin:$PATH
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
      - nm1-local:/hadoop/yarn/local
      - nm1-logs:/var/log/hadoop-yarn
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /hadoop/yarn/local /var/log/hadoop-yarn && chmod -R 1777 /hadoop/yarn/local /var/log/hadoop-yarn && exec yarn nodemanager"]
    ports:
      - "8042:8042"
    restart: unless-stopped

  nodemanager-2:
    image: sertitanius/spark_machine_learning-hadoop:3.3.6
    container_name: nodemanager-2
    hostname: nodemanager-2
    user: "0:0"
    init: true  # см. комментарий nodemanager-1
    networks: [bench-net]
    depends_on:
      resourcemanager: { condition: service_healthy }
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - PATH=/opt/hadoop/bin:/opt/hadoop/sbin:$PATH
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
      - nm2-local:/hadoop/yarn/local
      - nm2-logs:/var/log/hadoop-yarn
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /hadoop/yarn/local /var/log/hadoop-yarn && chmod -R 1777 /hadoop/yarn/local /var/log/hadoop-yarn && exec yarn nodemanager"]
    ports:
      - "8043:8042"
    restart: unless-stopped

  spark-master:
    image: sertitanius/spark_machine_learning-spark:3.3
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"   # Spark Master UI
      - "7077:7077"   # Spark Master RPC
    volumes:
      - spark-history:/opt/spark/history
    networks: [bench-net]
    healthcheck:
      test: ["CMD-SHELL","/bin/bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  spark-history:
    image: sertitanius/spark_machine_learning-spark:3.3
    container_name: spark-history
    depends_on:
      spark-master:
        condition: service_healthy
    networks: [bench-net]
    ports:
      - "18080:18080"
    volumes:
      - spark-history:/opt/spark/history
    environment:
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=file:/opt/spark/history -Dspark.history.ui.port=18080
    command: ["bash","-lc","mkdir -p /opt/spark/history && /opt/bitnami/spark/sbin/start-history-server.sh && sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL","/bin/bash -lc 'exec 3<>/dev/tcp/127.0.0.1/18080' || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  hibench:
    image: sertitanius/spark_machine_learning-hibench:1.0.0
    container_name: hibench
    depends_on:
      namenode:        { condition: service_healthy }
      datanode:        { condition: service_healthy }
      resourcemanager: { condition: service_healthy }
      spark-master:    { condition: service_healthy }
    networks: [bench-net]
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
      - ./config/hibench/hibench.conf:/opt/hibench/conf/hibench.conf.template:ro
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - PATH=/opt/hadoop/bin:/opt/hadoop/sbin:/opt/spark/bin:$PATH
    command: ["bash","-lc","sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL","/bin/bash -lc '/opt/hadoop/bin/hdfs dfs -fs hdfs://namenode:8020 -ls / >/dev/null 2>&1 && [ -f /opt/hibench/sparkbench/assembly/target/sparkbench-assembly-8.0-SNAPSHOT-dist.jar ]'"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  recommender:
    build:
      context: .
      dockerfile: docker/recommender/Dockerfile
    container_name: recommender
    networks: [bench-net]
    ports:
      - "8001:8000"
    volumes:
      # Монтируем артефакты моделей — обновление без пересборки образа
      - ./out:/app/out
      # В dev-режиме монтируем исходники для hot-reload:
      # docker compose run --rm recommender uvicorn recommender.api:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - RECOMMENDER_MODEL_DIR=/app/out/final_best
      - RECOMMENDER_ADMIN_KEY=${RECOMMENDER_ADMIN_KEY:-spark-admin-2026}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mlflow:
    image: sertitanius/spark_machine_learning-mlflow:1.0.0
    container_name: mlflow
    networks: [bench-net]
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_ARTIFACTS_DESTINATION=file:///mlartifacts
    volumes:
      - mlruns:/mlruns
      - mlartifacts:/mlartifacts
    command: >
      bash -lc "
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri file:/mlruns
      --default-artifact-root file:/mlartifacts
      "
    restart: unless-stopped
