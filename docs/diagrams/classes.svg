<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" style="background:#fff"><style>
  .title{font-family:Arial,sans-serif;font-size:16px;font-weight:700;fill:#111827}
  .label{font-family:Arial,sans-serif;font-size:12px;fill:#111827}
  .small{font-family:Arial,sans-serif;font-size:10px;fill:#374151}
  .tiny{font-family:Arial,sans-serif;font-size:9px;fill:#374151}
  .head{font-family:Arial,sans-serif;font-size:12px;font-weight:700;fill:#111827}
  .muted{font-family:Arial,sans-serif;font-size:11px;fill:#4b5563}
</style><defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,4 L0,8 Z" fill="#374151"/>
  </marker>
  <marker id="dashArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,4 L0,8 Z" fill="#6b7280"/>
  </marker>
</defs><text x="700" y="30" text-anchor="middle" class="title"><tspan x="700" dy="0">Рисунок 3 — Диаграмма классов и основных контрактов API</tspan></text><rect x="40" y="70" width="270" height="145" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><rect x="40" y="70" width="270" height="28" rx="2" fill="#e5e7eb" stroke="#2563eb" stroke-width="1.4"/><text x="175.0" y="89" text-anchor="middle" class="head"><tspan x="175.0" dy="0">RecommendRequest</tspan></text><text x="50" y="118" text-anchor="start" class="small"><tspan x="50" dy="0">+ job_type: str</tspan><tspan x="50" dy="13">+ input: InputSpec</tspan><tspan x="50" dy="13">+ topology: TopologySpec</tspan><tspan x="50" dy="13">+ constraints: ConstraintsSpec | None</tspan><tspan x="50" dy="13">+ preferences: PreferencesSpec | None</tspan></text><rect x="40" y="245" width="270" height="100" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><rect x="40" y="245" width="270" height="28" rx="2" fill="#e5e7eb" stroke="#2563eb" stroke-width="1.4"/><text x="175.0" y="264" text-anchor="middle" class="head"><tspan x="175.0" dy="0">PredictRequest</tspan></text><text x="50" y="293" text-anchor="start" class="small"><tspan x="50" dy="0">+ job_type: str</tspan><tspan x="50" dy="13">+ topology_* fields</tspan><tspan x="50" dy="13">+ 16 Spark parameters</tspan><tspan x="50" dy="13">+ profile: str</tspan></text><rect x="365" y="70" width="285" height="150" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><rect x="365" y="70" width="285" height="28" rx="2" fill="#e5e7eb" stroke="#d97706" stroke-width="1.4"/><text x="507.5" y="89" text-anchor="middle" class="head"><tspan x="507.5" dy="0">FastAPI app / Router</tspan></text><text x="375" y="118" text-anchor="start" class="small"><tspan x="375" dy="0">- registry: ModelRegistry</tspan><tspan x="375" dy="13">- services: dict[str, PredictorService]</tspan><tspan x="375" dy="13">+ recommend(req): RecommendResponse</tspan><tspan x="375" dy="13">+ predict(req): PredictResponse</tspan><tspan x="375" dy="13">+ metrics(), jobs(), history()</tspan></text><rect x="365" y="255" width="285" height="125" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><rect x="365" y="255" width="285" height="28" rx="2" fill="#e5e7eb" stroke="#16a34a" stroke-width="1.4"/><text x="507.5" y="274" text-anchor="middle" class="head"><tspan x="507.5" dy="0">config_generator.py</tspan></text><text x="375" y="303" text-anchor="start" class="small"><tspan x="375" dy="0">+ generate_candidates(topology, profile, n, constraints)</tspan><tspan x="375" dy="13">  : list[dict]</tspan><tspan x="375" dy="13">- clamps executor cores/memory/instances</tspan><tspan x="375" dy="13">- fills 16 Spark parameters</tspan></text><rect x="705" y="70" width="290" height="145" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><rect x="705" y="70" width="290" height="28" rx="2" fill="#e5e7eb" stroke="#16a34a" stroke-width="1.4"/><text x="850.0" y="89" text-anchor="middle" class="head"><tspan x="850.0" dy="0">PredictorService</tspan></text><text x="715" y="118" text-anchor="start" class="small"><tspan x="715" dy="0">- model: sklearn estimator</tspan><tspan x="715" dy="13">- preprocessor: ColumnTransformer</tspan><tspan x="715" dy="13">- feature_cols: list[str]</tspan><tspan x="715" dy="13">+ predict_one(row): (pred, p5, p95)</tspan><tspan x="715" dy="13">+ predict_batch(rows): arrays</tspan></text><rect x="705" y="255" width="290" height="125" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><rect x="705" y="255" width="290" height="28" rx="2" fill="#e5e7eb" stroke="#d97706" stroke-width="1.4"/><text x="850.0" y="274" text-anchor="middle" class="head"><tspan x="850.0" dy="0">ModelRegistry</tspan></text><text x="715" y="303" text-anchor="start" class="small"><tspan x="715" dy="0">- base_dir: Path</tspan><tspan x="715" dy="13">- cache: dict[str, ModelArtifact]</tspan><tspan x="715" dy="13">+ load_all(job_types)</tspan><tspan x="715" dy="13">+ get(job_type): ModelArtifact</tspan></text><rect x="1040" y="70" width="285" height="125" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><rect x="1040" y="70" width="285" height="28" rx="2" fill="#e5e7eb" stroke="#2563eb" stroke-width="1.4"/><text x="1182.5" y="89" text-anchor="middle" class="head"><tspan x="1182.5" dy="0">RecommendResponse</tspan></text><text x="1050" y="118" text-anchor="start" class="small"><tspan x="1050" dy="0">+ recommendations: list[RecommendationItem]</tspan><tspan x="1050" dy="13">+ model_info: ModelInfo</tspan><tspan x="1050" dy="13"></tspan><tspan x="1050" dy="13">RecommendationItem: config, runtime, speedup, p5/p95</tspan></text><rect x="1040" y="245" width="285" height="125" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><rect x="1040" y="245" width="285" height="28" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/><text x="1182.5" y="264" text-anchor="middle" class="head"><tspan x="1182.5" dy="0">SQLite history</tspan></text><text x="1050" y="293" text-anchor="start" class="small"><tspan x="1050" dy="0">+ init_db()</tspan><tspan x="1050" dy="13">+ log_request(endpoint, request, response)</tspan><tspan x="1050" dy="13">+ get_history(limit, offset)</tspan><tspan x="1050" dy="13">+ get_stats()</tspan></text><rect x="365" y="435" width="285" height="130" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><rect x="365" y="435" width="285" height="28" rx="2" fill="#e5e7eb" stroke="#7c3aed" stroke-width="1.4"/><text x="507.5" y="454" text-anchor="middle" class="head"><tspan x="507.5" dy="0">Offline RL optimizers</tspan></text><text x="375" y="483" text-anchor="start" class="small"><tspan x="375" dy="0">TabularQLearning, DQN, PPO, Bayesian</tspan><tspan x="375" dy="13">используются в training/train_rl.py</tspan><tspan x="375" dy="13">не являются runtime-зависимостью API</tspan></text><line x1="310" y1="142" x2="365" y2="142" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="310" y1="295" x2="365" y2="165" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="650" y1="145" x2="705" y2="145" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="650" y1="318" x2="705" y2="318" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="995" y1="142" x2="1040" y2="132" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="650" y1="145" x2="1040" y2="300" stroke="#374151" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#dashArrow)"/><line x1="505" y1="220" x2="505" y2="255" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="850" y1="215" x2="850" y2="255" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="505" y1="380" x2="505" y2="435" stroke="#374151" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#dashArrow)"/><text x="535" y="420" text-anchor="middle" class="tiny"><tspan x="535" dy="0">обучение/эксперименты</tspan></text></svg>
