</defs><text x="700" y="30" text-anchor="middle" class="title"><tspan x="700" dy="0">Рисунок 5 — Поток данных: сбор PageRank, обучение и рекомендация</tspan></text><rect x="55" y="90" width="210" height="70" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="160.0" y="114" text-anchor="middle" class="small"><tspan x="160.0" dy="0">Yandex Cloud VM</tspan><tspan x="160.0" dy="13">64 vCPU / 128 GB RAM</tspan><tspan x="160.0" dy="13">600 GB SSD</tspan></text><rect x="330" y="90" width="230" height="85" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="445.0" y="114" text-anchor="middle" class="small"><tspan x="445.0" dy="0">docker-compose</tspan><tspan x="445.0" dy="13">Spark Standalone + HDFS</tspan><tspan x="445.0" dy="13">YARN для prepare</tspan><tspan x="445.0" dy="13">HiBench + MLflow</tspan></text><rect x="630" y="90" width="250" height="85" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="755.0" y="114" text-anchor="middle" class="small"><tspan x="755.0" dy="0">run_hibench_experiments.sh</tspan><tspan x="755.0" dy="13">PageRank матрица:</tspan><tspan x="755.0" dy="13">6 топологий × 2 профиля</tspan><tspan x="755.0" dy="13">× 80 конфигов</tspan></text><rect x="950" y="90" width="260" height="85" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="1080.0" y="114" text-anchor="middle" class="small"><tspan x="1080.0" dy="0">collect_hibench_data.sh</tspan><tspan x="1080.0" dy="13">REPEATS=3</tspan><tspan x="1080.0" dy="13">median + cv_duration</tspan><tspan x="1080.0" dy="13">schema_version=2</tspan></text><rect x="80" y="260" width="280" height="95" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="220.0" y="284" text-anchor="middle" class="small"><tspan x="220.0" dy="0">data/hibench_train_20260424_175032_clean.csv</tspan><tspan x="220.0" dy="13">PageRank clean: 917 строк</tspan><tspan x="220.0" dy="13">исходный CSV: 960 строк</tspan></text><rect x="430" y="260" width="250" height="95" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="555.0" y="284" text-anchor="middle" class="small"><tspan x="555.0" dy="0">models/data.py</tspan><tspan x="555.0" dy="13">parse memory strings</tspan><tspan x="555.0" dy="13">OneHotEncoder + StandardScaler</tspan><tspan x="555.0" dy="13">target: median_duration_s</tspan></text><rect x="750" y="260" width="250" height="95" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="875.0" y="284" text-anchor="middle" class="small"><tspan x="875.0" dy="0">training/train_baseline.py</tspan><tspan x="875.0" dy="13">RF RandomSearch / RF SA</tspan><tspan x="875.0" dy="13">ExtraTrees, SVR, MLP</tspan><tspan x="875.0" dy="13">report.json + joblib</tspan></text><rect x="1070" y="260" width="250" height="95" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="1195.0" y="284" text-anchor="middle" class="small"><tspan x="1195.0" dy="0">out/final_best/pagerank</tspan><tspan x="1195.0" dy="13">актуальная модель:</tspan><tspan x="1195.0" dy="13">RandomForest_RandomSearch</tspan><tspan x="1195.0" dy="13">MAE=8.97s, R²=0.844</tspan></text><rect x="300" y="465" width="250" height="90" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="425.0" y="489" text-anchor="middle" class="small"><tspan x="425.0" dy="0">FastAPI recommender</tspan><tspan x="425.0" dy="13">ModelRegistry выбирает</tspan><tspan x="425.0" dy="13">лучшую модель по MAE</tspan><tspan x="425.0" dy="13">из report.json</tspan></text><rect x="650" y="465" width="250" height="90" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="775.0" y="489" text-anchor="middle" class="small"><tspan x="775.0" dy="0">/recommend</tspan><tspan x="775.0" dy="13">generate candidates</tspan><tspan x="775.0" dy="13">predict_batch</tspan><tspan x="775.0" dy="13">sort + top-K</tspan></text><rect x="1000" y="465" width="230" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="1115.0" y="489" text-anchor="middle" class="small"><tspan x="1115.0" dy="0">Пользователь</tspan><tspan x="1115.0" dy="13">получает Spark config,</tspan><tspan x="1115.0" dy="13">predicted runtime,</tspan><tspan x="1115.0" dy="13">speedup и p5/p95</tspan></text><rect x="650" y="610" width="250" height="70" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="775.0" y="634" text-anchor="middle" class="small"><tspan x="775.0" dy="0">scripts/e2e_validate.sh</tspan><tspan x="775.0" dy="13">будущая проверка</tspan><tspan x="775.0" dy="13">predicted vs actual</tspan></text><line x1="265" y1="125" x2="330" y2="125" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="560" y1="132" x2="630" y2="132" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="880" y1="132" x2="950" y2="132" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="1080" y1="175" x2="220" y2="260" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="360" y1="308" x2="430" y2="308" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="680" y1="308" x2="750" y2="308" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="1000" y1="308" x2="1070" y2="308" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="1195" y1="355" x2="425" y2="465" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="550" y1="510" x2="650" y2="510" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="900" y1="510" x2="1000" y2="510" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="775" y1="610" x2="775" y2="555" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><text x="820" y="594" text-anchor="middle" class="tiny"><tspan x="820" dy="0">e2e test calls API</tspan></text></svg>
