</defs><text x="720" y="30" text-anchor="middle" class="title"><tspan x="720" dy="0">Рисунок 4 — Диаграмма последовательности обработки запроса /recommend</tspan></text><rect x="35" y="60" width="110" height="42" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="90" y="84" text-anchor="middle" class="small"><tspan x="90" dy="0">Пользователь</tspan></text><line x1="90" y1="102" x2="90" y2="700" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6,4"/><rect x="230" y="60" width="110" height="42" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="285" y="84" text-anchor="middle" class="small"><tspan x="285" dy="0">FastAPI Router</tspan></text><line x1="285" y1="102" x2="285" y2="700" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6,4"/><rect x="415" y="60" width="110" height="42" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="470" y="84" text-anchor="middle" class="small"><tspan x="470" dy="0">Pydantic</tspan><tspan x="470" dy="12">Validator</tspan></text><line x1="470" y1="102" x2="470" y2="700" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6,4"/><rect x="625" y="60" width="110" height="42" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="680" y="84" text-anchor="middle" class="small"><tspan x="680" dy="0">Config</tspan><tspan x="680" dy="12">Generator</tspan></text><line x1="680" y1="102" x2="680" y2="700" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6,4"/><rect x="855" y="60" width="110" height="42" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="910" y="84" text-anchor="middle" class="small"><tspan x="910" dy="0">Ranker</tspan></text><line x1="910" y1="102" x2="910" y2="700" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6,4"/><rect x="1085" y="60" width="110" height="42" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="1140" y="84" text-anchor="middle" class="small"><tspan x="1140" dy="0">Predictor</tspan><tspan x="1140" dy="12">Service</tspan></text><line x1="1140" y1="102" x2="1140" y2="700" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6,4"/><rect x="1270" y="60" width="110" height="42" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="1325" y="84" text-anchor="middle" class="small"><tspan x="1325" dy="0">SQLite</tspan><tspan x="1325" dy="12">History</tspan></text><line x1="1325" y1="102" x2="1325" y2="700" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6,4"/><line x1="90" y1="135" x2="285" y2="135" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><text x="187.5" y="128" text-anchor="middle" class="tiny"><tspan x="187.5" dy="0">1: POST /recommend(job_type, input, topology, constraints)</tspan></text><line x1="285" y1="175" x2="470" y2="175" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><text x="377.5" y="168" text-anchor="middle" class="tiny"><tspan x="377.5" dy="0">2: validate(req)</tspan></text><line x1="470" y1="208" x2="285" y2="208" stroke="#374151" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#dashArrow)"/><text x="377.5" y="201" text-anchor="middle" class="tiny"><tspan x="377.5" dy="0">3: valid / 422 ValidationError</tspan></text><rect x="250" y="230" width="1010" height="52" rx="2" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,4"/><text x="263" y="248" text-anchor="start" class="tiny"><tspan x="263" dy="0">ref startup: init_db(); ModelRegistry.load_all([&quot;pagerank&quot;]); PredictorService(...)</tspan></text><line x1="285" y1="315" x2="680" y2="315" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><text x="482.5" y="308" text-anchor="middle" class="tiny"><tspan x="482.5" dy="0">4: generate_candidates(topology, profile, constraints, n=200)</tspan></text><line x1="680" y1="350" x2="285" y2="350" stroke="#374151" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#dashArrow)"/><text x="482.5" y="343" text-anchor="middle" class="tiny"><tspan x="482.5" dy="0">5: list[200 Spark configs]</tspan></text><line x1="285" y1="405" x2="910" y2="405" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><text x="597.5" y="398" text-anchor="middle" class="tiny"><tspan x="597.5" dy="0">6: rank candidates by predicted runtime</tspan></text><rect x="875" y="425" width="310" height="95" rx="2" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,4"/><text x="888" y="443" text-anchor="start" class="tiny"><tspan x="888" dy="0">batch [200 кандидатов одним вызовом]</tspan></text><line x1="910" y1="470" x2="1140" y2="470" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><text x="1025.0" y="463" text-anchor="middle" class="tiny"><tspan x="1025.0" dy="0">7: predict_batch(candidates_df)</tspan></text><line x1="1140" y1="505" x2="910" y2="505" stroke="#374151" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#dashArrow)"/><text x="1025.0" y="498" text-anchor="middle" class="tiny"><tspan x="1025.0" dy="0">8: preds, p5, p95 arrays</tspan></text><line x1="910" y1="555" x2="285" y2="555" stroke="#374151" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#dashArrow)"/><text x="597.5" y="548" text-anchor="middle" class="tiny"><tspan x="597.5" dy="0">9: top-K RecommendationItem[]</tspan></text><line x1="285" y1="610" x2="1325" y2="610" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/><text x="805.0" y="603" text-anchor="middle" class="tiny"><tspan x="805.0" dy="0">10: log_request(req, resp, elapsed_ms)</tspan></text><line x1="285" y1="665" x2="90" y2="665" stroke="#374151" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#dashArrow)"/><text x="187.5" y="658" text-anchor="middle" class="tiny"><tspan x="187.5" dy="0">11: 200 OK + RecommendResponse</tspan></text></svg>
