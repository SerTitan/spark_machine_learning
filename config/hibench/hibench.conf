# ======== CORE PATHS ========
hibench.home                 /opt/hibench
hibench.hadoop.home          /opt/hadoop
hibench.hadoop.executable    /opt/hadoop/bin/hadoop
hibench.hadoop.configure.dir /opt/hadoop/etc/hadoop
hibench.hdfs.master          hdfs://namenode:8020
# hibench.hdfs.data.dir оставляем unset, тогда HiBench кладёт вход в /<Workload>/Input
# (так работал существующий WordCount-pipeline — сохраняем совместимость).

hibench.spark.home           /opt/spark
hibench.spark.master         spark://spark-master:7077

# ======== REPORT ========
hibench.configure.dir        ${hibench.home}/conf
hibench.report.dir           ${hibench.home}/report
hibench.report.name          hibench.report
hibench.report.formats       "%-12s %-10s %-8s %-20s %-20s %-20s %-20s\n"

# ======== DATA/IO FORMATS ========
sparkbench.inputformat         Sequence
sparkbench.outputformat        Sequence
hibench.workload.dir.name.input  Input
hibench.workload.dir.name.output Output

# ======== PARALLELISM ========
hibench.default.map.parallelism       8
hibench.default.reduce.parallelism    4
hibench.default.shuffle.parallelism   8

# ======== SCALE (rewritten by scripts) ========
# tiny | small | large | huge | gigantic | bigdata | custom
hibench.scale.profile        small

# ======== HIBENCH JARS ========
# ВАЖНО: datatool jar обязателен для PageRank, KMeans, Bayes, SQL workloads.
hibench.sparkbench.jar       ${hibench.home}/sparkbench/assembly/target/sparkbench-assembly-8.0-SNAPSHOT-dist.jar
hibench.hibench.datatool.dir ${hibench.home}/autogen/target/autogen-8.0-SNAPSHOT-jar-with-dependencies.jar

# ======== TOPOLOGY PLACEHOLDERS ========
hibench.masters.hostnames    spark-master
hibench.slaves.hostnames     spark-master
